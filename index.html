<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusinessIndia App Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .app {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .app h2 {
      margin-top: 0;
    }

    .download {
      display: inline-block;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>BusinessIndia App Store</h1>
  <p>अपने पसंदीदा Apps डाउनलोड करें</p>
</header>

<div class="container">

  <input
    class="search"
    type="text"
    placeholder="App खोजें..."
    onkeyup="searchApps(this.value)"
  >

  <div id="apps">

    <div class="app">
      <h2>BusinessIndia App</h2>
      <p>Business और technology से जुड़ी जानकारी के लिए हमारा ऐप।</p>
      <p><strong>Version:</strong> 1.0</p>
      <p><strong>Rating:</strong> ⭐⭐⭐⭐⭐</p>
      <a class="download" href="#">Download APK</a>
    </div>

  </div>

</div>

<footer>
  © 2026 BusinessIndia App Store
</footer>

<script>
function searchApps(text) {
  const apps = document.querySelectorAll(".app");
  text = text.toLowerCase();

  apps.forEach(function(app) {
    app.style.display =
      app.innerText.toLowerCase().includes(text)
      ? "block"
      : "none";
  });
}
</script>

</body>
  </html>
